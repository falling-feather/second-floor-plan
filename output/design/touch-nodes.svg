<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" font-family="Microsoft YaHei, sans-serif"><text x="40" y="40" font-size="25" fill="#353b34" text-anchor="start">同一木质桌边，回应不同的身体尺度</text><text x="40" y="73" font-size="14" fill="#7c8273" text-anchor="start">圆角来自实际构件；钢框、桌脚与台下目标体积另行核对。产品荷载和连接件仍需深化。</text><text x="45" y="124" font-size="20" fill="#a96340" text-anchor="start">01 / 共读桌的平面与桌端</text><g transform="translate(100 185) scale(0.15)"><rect x="0" y="0" width="2400" height="1200" rx="160" fill="#e1d2b5" stroke="#353b34" stroke-width="9"/><path d="M70 85L2330 85" stroke="#7c8975" stroke-width="30" fill="none" stroke-dasharray="55 30"/><path d="M70 1115L2330 1115" stroke="#7c8975" stroke-width="30" fill="none" stroke-dasharray="55 30"/><path d="M527.5 70L527.5 1130" stroke="#7c8975" stroke-width="55" fill="none" stroke-dasharray="55 30"/><path d="M1877.5 70L1877.5 1130" stroke="#7c8975" stroke-width="55" fill="none" stroke-dasharray="55 30"/><g><path d="M0 -220L2400 -220" stroke="#959c8d" stroke-width="10" fill="none" /><path d="M0 -290L0 -150" stroke="#959c8d" stroke-width="10" fill="none" /><path d="M2400 -290L2400 -150" stroke="#959c8d" stroke-width="10" fill="none" /><text x="1200" y="-320" font-size="180" fill="#858e7b" text-anchor="middle">2400</text></g><g><path d="M2640 0L2640 1200" stroke="#959c8d" stroke-width="10" fill="none" /><path d="M2570 0L2710 0" stroke="#959c8d" stroke-width="10" fill="none" /><path d="M2570 1200L2710 1200" stroke="#959c8d" stroke-width="10" fill="none" /><text transform="translate(2470 600) rotate(-90)" text-anchor="middle" font-size="180" fill="#858e7b">1200</text></g><path d="M0 160L0 1040" stroke="#a96340" stroke-width="20" fill="none" /></g><text x="45" y="420" font-size="18" fill="#353b34" text-anchor="start">R160端角 · 端部保留880mm直边</text><text x="45" y="454" font-size="16" fill="#7c8273" text-anchor="start">内退钢框将接触边与支撑分开</text><text x="45" y="484" font-size="13" fill="#7c8273" text-anchor="start">虚线为台下构件平面投影；具体净空见台下检查图。</text><text x="680" y="124" font-size="20" fill="#a96340" text-anchor="start">02 / 近处陪伴与手边托台</text><path d="M680 385L1150 385" stroke="#353b34" stroke-width="1" fill="none" /><rect x="700" y="287.8" width="252" height="5.3999999999999995" rx="0" fill="#d4bd94" stroke="#353b34" stroke-width="1"/><path d="M740 293.2L740 385" stroke="#353b34" stroke-width="4" fill="none" /><text x="700" y="271.8" font-size="16" fill="#a96340" text-anchor="start">儿童桌 +540</text><rect x="1000" y="251.8" width="108" height="5.3999999999999995" rx="0" fill="#d4bd94" stroke="#353b34" stroke-width="1"/><path d="M1015 257.2L1015 385" stroke="#353b34" stroke-width="4" fill="none" /><path d="M1095 257.2L1095 385" stroke="#353b34" stroke-width="4" fill="none" /><text x="995" y="235.8" font-size="16" fill="#a96340" text-anchor="start">托台 +740</text><text x="680" y="420" font-size="14" fill="#7c8273" text-anchor="start">标高对读 / 家具展开示意</text><text x="680" y="454" font-size="17" fill="#353b34" text-anchor="start">托台600×500mm，R80</text><text x="680" y="485" font-size="14" fill="#7c8273" text-anchor="start">0.30㎡包围范围；与陪伴座椅相邻，不增加席位</text><path d="M40 530L1160 530" stroke="#d3d8c8" stroke-width="1" fill="none" /><text x="40" y="567" font-size="18" fill="#353b34" text-anchor="start">从临窗R120、儿童R80到共读R160：圆角随用途调整，木质边缘保持连续。</text><text x="40" y="605" font-size="14" fill="#7c8273" text-anchor="start">740mm固定桌高提供同桌参与的设计目标；不能据此承诺适配全部身体与器具。</text><text x="40" y="643" font-size="14" fill="#7c8273" text-anchor="start">灯具同样拆分为实体外壳、内退12mm扩散面与吊杆，图纸和模型读取同一组部件。</text></svg>